<!-- Subscription Modal Partial -->
<div id="subscription-modal" class="fixed inset-0 hidden items-center justify-center bg-black/50 backdrop-blur-sm z-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg max-w-2xl w-full mx-4 p-4 relative">
    <button id="modal-close" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700" aria-label="{{t.modal.close}}">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <h2 class="text-xl font-semibold mb-4 text-center">{{t.modal.subscriptionTitle}}</h2>
    <div class="aspect-w-3 aspect-h-4">
      <iframe id="subscription-iframe" src="" class="w-full h-full border-0 rounded" allowfullscreen sandbox="allow-top-navigation allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
    </div>
  </div>
</div>
